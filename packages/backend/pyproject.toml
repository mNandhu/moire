[project]
name = "moire-gallery"
version = "0.1.0"
description = "Organize, tag and generate AI images: a local gallery for your ComfyUI outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "uvicorn",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite",
  "pillow",
  "python-dotenv",
  "httpx",
  "numpy>=2.4.0,<3.0",
  "pydantic-settings>=2.14.1",
  "watchfiles>=1.0",
  "tzdata>=2026.5",
  "websockets>=15",
]

# The AI tagger's runtime for an installed Moiré: `uv tool install
# "moire-gallery[cpu]"` or `[gpu]`. Same lists as the `cpu`/`gpu` dependency
# groups below (which a dev checkout uses); keep them in step. uv can't point a
# group at a conflicting extra of its own project.
[project.optional-dependencies]
cpu = ["onnxruntime>=1.23.0,<2.0"]
gpu = [
    "onnxruntime-gpu>=1.23.2,<1.24; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-curand-cu12; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12; sys_platform != 'darwin'",
]

[project.scripts]
moire = "moire.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src layout: the importable package is `src/moire`, whatever the PyPI name.
module-name = "moire"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv]
# onnxruntime comes from one of two conflicting groups: `cpu` (default) or
# `gpu` (CUDA); the extras of the same names mirror them. See README "GPU tagging".
default-groups = ["dev", "cpu"]
conflicts = [
    [{ group = "cpu" }, { group = "gpu" }],
    [{ extra = "cpu" }, { extra = "gpu" }],
]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]
cpu = ["onnxruntime>=1.23.0,<2.0"]
# AI tagging on an NVIDIA GPU (CUDA 12 + cuDNN 9 from pip, ~2 GB). Swap in with
# `UV_NO_GROUP=cpu uv sync --group gpu`; not available on macOS. Pinned to the
# 1.23 line, the one verified with these CUDA 12 wheels.
gpu = [
    "onnxruntime-gpu>=1.23.2,<1.24; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-curand-cu12; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12; sys_platform != 'darwin'",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

