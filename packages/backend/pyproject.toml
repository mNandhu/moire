[project]
name = "moire-backend"
version = "0.1.0"
description = "Moiré backend API server (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "uvicorn",
  "sqlalchemy>=2.0",
  "aiosqlite",
  "pillow",
  "python-dotenv",
  "httpx",
  "numpy>=2.4.0,<3.0",
  "pydantic-settings>=2.14.1",
  "watchfiles>=1.0",
  "tzdata>=2026.5",
  "websockets>=15",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the importable package is the top-level `src/` directory itself
# (imported as `src.main`), not `src/<name>/`.
module-root = ""
module-name = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# onnxruntime comes from one of two conflicting groups: `cpu` (default) or
# `gpu` (CUDA). See README "GPU tagging".
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]
cpu = ["onnxruntime>=1.23.0,<2.0"]
# AI tagging on an NVIDIA GPU (CUDA 12 + cuDNN 9 from pip, ~2 GB). Swap in with
# `UV_NO_GROUP=cpu uv sync --group gpu`; not available on macOS. Pinned to the
# 1.23 line, the one verified with these CUDA 12 wheels.
gpu = [
    "onnxruntime-gpu>=1.23.2,<1.24; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12; sys_platform != 'darwin'",
    "nvidia-cufft-cu12; sys_platform != 'darwin'",
    "nvidia-curand-cu12; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12; sys_platform != 'darwin'",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

