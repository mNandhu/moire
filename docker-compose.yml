# Moiré: FastAPI backend (embedded SQLite + filesystem thumbnails) and the
# nginx-served frontend. No database or object-store containers; all state
# lives in the `moire_data` volume mounted at /data in the backend.
#
# Libraries are folders on the host: mount them into the backend (read-only is
# fine) in docker-compose.override.yml, then add them in the UI by their
# in-container path (e.g. /mnt/g/images).
services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: moire-backend
    restart: unless-stopped
    volumes:
      - moire_data:/data
    environment:
      SQLITE_PATH: /data/moire.db
      THUMB_ROOT: /data/thumbs
      MODEL_CACHE_DIR: /data/models
      # Containers log to stdout (`docker compose logs`); no rotating file.
      LOG_TO_FILE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      THUMB_MAX_SIZE: ${THUMB_MAX_SIZE:-768}
      SCANNER_MAX_WORKERS: ${SCANNER_MAX_WORKERS:-0}
      SCANNER_MAX_CONCURRENT_SCANS: ${SCANNER_MAX_CONCURRENT_SCANS:-2}
      # inotify doesn't see changes made on a Windows/macOS host through a bind
      # mount; the periodic reconcile rescan is the backstop there.
      WATCH_ENABLED_DEFAULT: ${WATCH_ENABLED_DEFAULT:-true}
      WATCH_RECONCILE_INTERVAL_S: ${WATCH_RECONCILE_INTERVAL_S:-900}
    ports:
      - "${MOIRE_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: moire-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MOIRE_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  moire_data:
