name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same PR; every push to main finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/backend/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check . ../e2e/servers
          uv run ruff format --check . ../e2e/servers

      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Versions agree
        run: pnpm version:check

      - name: Type check
        run: pnpm -C packages/frontend exec tsc -b

      - name: ESLint
        run: pnpm -C packages/frontend lint

      - name: Vitest
        run: pnpm -C packages/frontend test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/backend/uv.lock

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv --directory packages/backend sync --locked

      # vite only: the frontend job already type checks.
      - name: Build the UI into the backend
        run: pnpm -C packages/frontend exec vite build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm -C packages/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C packages/e2e exec playwright install --with-deps chromium

      - name: Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C packages/e2e exec playwright install-deps chromium

      # The WD tagger the AI tagging spec runs (~360 MB), downloaded once per
      # default model (ai_settings.py's model_repo).
      - name: Tagger model
        id: tagger
        run: echo "repo=$(grep -oP '"model_repo":\s*"\K[^"]+' packages/backend/src/moire/services/ai_settings.py)" >> "$GITHUB_OUTPUT"

      - name: Cache tagger model
        uses: actions/cache@v4
        with:
          path: packages/e2e/.models
          key: tagger-${{ steps.tagger.outputs.repo }}

      - name: E2E
        run: |
          pnpm -C packages/e2e typecheck
          pnpm -C packages/e2e test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7

  test-images-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose up (CI stack)
        run: |
          docker compose -f docker-compose.ci.yml up --build -d

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend healthy"; exit 0; fi; sleep 2; done; echo "Backend not healthy"; docker compose -f docker-compose.ci.yml logs backend; exit 1

      - name: Add library for test images
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"path":"/data/test_images","name":"ci-test"}' \
            http://localhost:8000/api/v1/libraries > add_lib.json
          cat add_lib.json
          echo "LIB_ID=$(jq -r '._id // .id' add_lib.json)" >> $GITHUB_ENV

      - name: Wait for scan to finish
        run: |
          for i in {1..120}; do
            DONE=$(curl -sf http://localhost:8000/api/v1/libraries/$LIB_ID/progress | jq -r '.scan_done');
            TOTAL=$(curl -sf http://localhost:8000/api/v1/libraries/$LIB_ID/progress | jq -r '.scan_total');
            SCANNING=$(curl -sf http://localhost:8000/api/v1/libraries/$LIB_ID/progress | jq -r '.scanning');
            echo "Progress: $DONE/$TOTAL (scanning=$SCANNING)";
            if [ "$SCANNING" = "false" ]; then break; fi; sleep 2; done
          curl -sf http://localhost:8000/api/v1/libraries/$LIB_ID/progress | tee progress.json
          test "$(jq -r '.indexed_count' progress.json)" != "0"

      - name: Verify images exist
        run: |
          curl -sf "http://localhost:8000/api/v1/images?limit=5&library_id=$LIB_ID" | tee images.json
          COUNT=$(jq length images.json)
          if [ "$COUNT" -lt 1 ]; then echo "No images indexed"; exit 1; fi

      - name: Verify media endpoints
        run: |
          IMG_ID=$(jq -r '.[0]._id' images.json)
          # HEAD thumb & file
          curl -sI http://localhost:8000/api/v1/images/$IMG_ID/thumb | tee head_thumb.txt
          curl -sI http://localhost:8000/api/v1/images/$IMG_ID/file | tee head_file.txt
          # GET thumb and file (both served straight from the local filesystem)
          curl -sfL http://localhost:8000/api/v1/images/$IMG_ID/thumb -o thumb.jpg
          curl -sfL http://localhost:8000/api/v1/images/$IMG_ID/file -o original.bin
          file thumb.jpg || true
          ls -lh thumb.jpg original.bin

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
